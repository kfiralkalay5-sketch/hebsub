[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hebsub"
version = "0.1.0"
description = "Local English-to-Hebrew subtitle translation for video libraries (Ollama), with gender-aware Hebrew"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # the core uses only the Python standard library

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
hebsub = "hebsub.cli:main"

[tool.setuptools]
packages = ["hebsub", "hebsub.vendor", "hebsub.vendor.cueivrit", "hebsub.vendor.cueivrit.scripts"]

[tool.setuptools.package-data]
hebsub = ["default_config.json"]
"hebsub.vendor.cueivrit" = ["LICENSE", "README.md", "references/*", "examples/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
